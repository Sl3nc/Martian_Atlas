[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/data/*.bin"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*.csv"
  [headers.values]
    Content-Type = "text/csv; charset=utf-8"
